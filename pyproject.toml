[project]
name = "lex-uz-ai-agent"
version = "0.1.0"
description = "Modda — Lex.uz maʼlumotlari asosida manbali huquqiy javoblar (RAG)"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pyarrow>=15",
  "psycopg[binary]>=3.2.10",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
modda = "modda.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
